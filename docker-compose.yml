services:
  # =========================================
  # Database (PostgreSQL)
  # =========================================
  postgres:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    container_name: ybb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - ybb-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Database GUI (PgAdmin) -> db.ybbhub.com
  # =========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ybb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ybbhub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - ybb-network
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`db.ybbhub.com`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # =========================================
  # Cache (Redis)
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: ybb-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - ybb-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Storage (MinIO) -> s3.ybbhub.com & console.ybbhub.com
  # =========================================
  minio:
    image: minio/minio:latest
    container_name: ybb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - /var/ybb-storage:/data
    networks:
      - ybb-network
      - web_gateway
    labels:
      - "traefik.enable=true"
      # API (S3)
      - "traefik.http.routers.minio-api.rule=Host(`s3.ybbhub.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=myresolver"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # Console (Dashboard)
      - "traefik.http.routers.minio-console.rule=Host(`console.ybbhub.com`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=myresolver"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # =========================================
  # Message Queue (RabbitMQ) -> queue.ybbhub.com
  # =========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ybb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ybb-network
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`queue.ybbhub.com`)"
      - "traefik.http.routers.rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq.tls.certresolver=myresolver"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================
  # API Gateway (NestJS) -> api.ybbhub.com
  # =========================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    container_name: ybb-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRATION}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./services/api:/app
      - /app/node_modules
      - /app/dist
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.ybbhub.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=4000"

  # =========================================
  # Payment Service (Go) -> payment.ybbhub.com
  # =========================================
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.dev
    container_name: ybb-payment-service
    restart: unless-stopped
    environment:
      PORT: 8002
      DATABASE_URL: ${DATABASE_URL_PAYMENT}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./services/payment-service:/app
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment.rule=Host(`payment.ybbhub.com`)"
      - "traefik.http.routers.payment.entrypoints=websecure"
      - "traefik.http.routers.payment.tls.certresolver=myresolver"
      - "traefik.http.services.payment.loadbalancer.server.port=8002"

  # =========================================
  # File Service (Python) -> files.ybbhub.com
  # =========================================
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    container_name: ybb-file-service
    restart: unless-stopped
    environment:
      PYTHON_ENV: ${NODE_ENV}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE}
      DATABASE_URL: ${DATABASE_URL_FILE}
      SERVICE_PORT: 8001
    volumes:
      - ./services/file-service:/app
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.rule=Host(`files.ybbhub.com`)"
      - "traefik.http.routers.files.entrypoints=websecure"
      - "traefik.http.routers.files.tls.certresolver=myresolver"
      - "traefik.http.services.files.loadbalancer.server.port=8001"

  # =========================================
  # Notification Service (NestJS) -> notification.ybbhub.com
  # =========================================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
    container_name: ybb-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4002
      RABBITMQ_URL: ${RABBITMQ_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
      - /app/dist
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.rule=Host(`notification.ybbhub.com`)"
      - "traefik.http.routers.notification.entrypoints=websecure"
      - "traefik.http.routers.notification.tls.certresolver=myresolver"
      - "traefik.http.services.notification.loadbalancer.server.port=4002"

  # =========================================
  # Admin Dashboard (Next.js) -> admin.ybbhub.com
  # =========================================
  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile.dev
    container_name: ybb-admin-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 4001
    volumes:
      - ./services/admin-dashboard:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.ybbhub.com`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=myresolver"
      - "traefik.http.services.admin.loadbalancer.server.port=4001"

  # =========================================
  # Landing Page / Static (Nginx) -> ybbhub.com
  # =========================================
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: ybb-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      - api
      - admin-dashboard
      - minio
      - payment-service
      - notification-service
      - file-service
      - rabbitmq
      - grafana
      - prometheus
      - pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`ybbhub.com`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=myresolver"
      - "traefik.http.services.landing.loadbalancer.server.port=80"

  # =========================================
  # Monitoring (Prometheus)
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ybb-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ybb-network

  # =========================================
  # Monitoring (Grafana) -> monitor.ybbhub.com
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ybb-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - ybb-network
      - web_gateway
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.ybbhub.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  ybb-network:
    driver: bridge
  web_gateway:
    external: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:


