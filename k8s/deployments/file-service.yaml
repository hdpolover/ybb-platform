apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: ybb-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
      - name: file-service
        image: ybb-platform/file-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: SERVICE_PORT
          value: "8001"
        - name: PYTHON_ENV
          value: "production"
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: ybb-config
              key: MINIO_ENDPOINT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ybb-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ybb-secrets
              key: MINIO_SECRET_KEY
        - name: MINIO_SECURE
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
