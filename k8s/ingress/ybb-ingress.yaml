apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ybb-ingress
  namespace: ybb-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - ybb-platform.com
    - www.ybb-platform.com
    secretName: ybb-tls-cert
  rules:
  - host: ybb-platform.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard
            port:
              number: 3000
