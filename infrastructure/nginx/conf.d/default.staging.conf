# Staging Configuration
# Upstream to the Admin Dashboard (Next.js)
upstream admin_dashboard_staging {
    # Matches the service name in docker-compose.dokploy.yml
    server admin-dashboard:4001;
}

# HTTP Server
# Handles requests to 'staging.ybbhub.com'
server {
    listen 80;
    server_name _;
    
    # Proxy Headers Global Configuration
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Optimization: Cache Next.js Static Assets (1 year)
    # These contain hashes in filenames, so they are safe to cache forever
    location /_next/static {
        proxy_pass http://admin_dashboard_staging;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimization: Cache General Static Assets (7 days)
    # Images, fonts, favicons, etc.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://admin_dashboard_staging;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Proxy to Admin Dashboard (Main App)
    location / {
        proxy_pass http://admin_dashboard_staging;
        
        # Don't cache HTML by default to ensure fresh content/SSR
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
