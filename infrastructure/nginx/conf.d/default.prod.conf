# Production Configuration
# Landing Page Server


# HTTP Server
# Handles requests to 'ybbhub.com'
server {
    listen 80;
    server_name _;
    
    # Optional: Serve static landing page files if they exist
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ =404;

    # Proxy to Admin Dashboard - REMOVED (Handled by Traefik on separate subdomain)
    # This server block now exclusively serves the Static Landing Page

}
