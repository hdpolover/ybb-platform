# Production Configuration
# Upstream to the Admin Dashboard (Next.js)
upstream admin_dashboard_prod {
    # Matches the service name in docker-compose.dokploy.yml
    server admin-dashboard:4001;
}

# HTTP Server
# Handles requests to 'ybbhub.com'
server {
    listen 80;
    server_name _;
    
    # Optional: Serve static landing page files if they exist
    # root /usr/share/nginx/html;
    # index index.html;

    # Proxy to Admin Dashboard
    location / {
        proxy_pass http://admin_dashboard_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
