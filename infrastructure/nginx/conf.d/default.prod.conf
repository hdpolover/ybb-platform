# Upstreams
upstream api_service {
    server ybb-api-prod:4000;
}

upstream admin_dashboard {
    server ybb-admin-dashboard-prod:4001;
}

upstream minio_s3 {
    server ybb-minio-prod:9000;
}

upstream minio_console {
    server ybb-minio-prod:9001;
}

upstream payment_service {
    server ybb-payment-service-prod:8002;
}

upstream notification_service {
    server ybb-notification-service-prod:4002;
}

upstream file_service {
    server ybb-file-service-prod:8001;
}

upstream rabbitmq_console {
    server ybb-rabbitmq-prod:15672;
}

upstream grafana_service {
    server ybb-grafana-prod:3000;
}

upstream prometheus_service {
    server ybb-prometheus-prod:9090;
}

upstream pgadmin_service {
    server ybb-pgadmin-prod:80;
}

upstream nextjs_frontend {
    server ybb-program-next:3000;
}

# HTTP Redirect (Handle all domains)
server {
    listen 80;
    server_name ybbhub.com *.ybbhub.com test.japanyouthsummit.com;
    
    # Certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Platform Domains (Let's Encrypt) ---

server {
    listen 443 ssl;
    http2 on;
    server_name ybbhub.com;
    
    ssl_certificate /etc/nginx/ssl/live/ybbhub.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ybbhub.com/privkey.pem;
    
    # Admin dashboard
    location / {
        proxy_pass http://admin_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ybbhub.com;
    
    ssl_certificate /etc/nginx/ssl/live/ybbhub.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ybbhub.com/privkey.pem;
    
    # API Gateway
    location / {
        proxy_pass http://api_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name s3.ybbhub.com;
    
    ssl_certificate /etc/nginx/ssl/live/ybbhub.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ybbhub.com/privkey.pem;
    
    client_max_body_size 500M;
    
    # MinIO S3 API
    location / {
        proxy_pass http://minio_s3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name console.ybbhub.com;
    
    ssl_certificate /etc/nginx/ssl/live/ybbhub.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ybbhub.com/privkey.pem;
    
    # MinIO Console (WebSockets required)
    location / {
        proxy_pass http://minio_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

