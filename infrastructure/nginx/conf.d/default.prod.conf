# Upstreams
# We only need to proxy to internal services that don't have their own Traefik labels
# or strict static hosting. Currently, ybbhub.com proxies to the Admin Dashboard.
upstream admin_dashboard {
    server ybb-admin-dashboard-prod:4001;
}

# HTTP Server (Traefik handles SSL termination)
# This handles requests to 'ybbhub.com' that are routed here by Traefik.
server {
    listen 80;
    server_name ybbhub.com;
    
    # Optional: Serve static landing page files if they exist
    # root /usr/share/nginx/html;
    # index index.html;

    # Current Behavior: Proxy to Admin Dashboard
    location / {
        proxy_pass http://admin_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
