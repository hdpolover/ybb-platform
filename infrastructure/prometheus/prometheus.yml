global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # YBB API Gateway metrics
  - job_name: 'ybb-api'
    static_configs:
      - targets: ['api:4000']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s

  # Redis metrics (requires redis_exporter, optional)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']
