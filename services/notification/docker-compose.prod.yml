services:
  # =========================================
  # Notification Service (Production)
  # =========================================
  notification:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-notification
    restart: always
    ports:
      - "4002:4002"
    env_file:
      - .env.prod
    networks:
      - ybb-network

networks:
  ybb-network:
    name: ybb-network
    external: true
