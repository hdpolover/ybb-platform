services:
  # =========================================
  # Admin Dashboard
  # =========================================
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ybb-admin-dashboard
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "3000:3000" # Usually next dev runs on 3000 by default unless configured
    env_file:
      - .env
    environment:
      # Overrides or additional vars if needed
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - default
