services:
  # =========================================
  # Admin Dashboard (Production)
  # =========================================
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-admin-dashboard
    restart: always
    ports:
      - "4001:4001"
    env_file:
      - .env.prod
    networks:
      - ybb-network

networks:
  ybb-network:
    name: ybb-network
    external: true
