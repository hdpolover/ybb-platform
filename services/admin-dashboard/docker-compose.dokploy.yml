services:
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ybb-prod-admin-dashboard
    restart: always
    deploy:
      resources:
        limits:
          # Must stay ABOVE the Node heap cap in Dockerfile.prod
          # (--max-old-space-size=512), not equal to it. RSS is heap plus
          # native allocations, V8 metadata and buffers, so a container limit
          # equal to the heap cap means a full old space gets the process
          # OOM-killed instead of garbage collected. 1.5x the heap is the
          # usual ratio. A limit is a ceiling, not a reservation, so the extra
          # 256M costs nothing until it is actually used.
          memory: 768M
    environment:
      NODE_ENV: production
      # Internal APIs
      NEXT_PUBLIC_API_URL: https://api.ybbhub.com
    networks:
      - dokploy-network
    labels:
      # Public routing comes from the Dokploy Domain config, which injects its
      # own web/websecure routers. A hand-written router here for the same
      # Host has no `.service=` and Traefik refuses it ("cannot be linked
      # automatically with multiple Services"), logging an error on every
      # config reload. Do not re-add one.
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
