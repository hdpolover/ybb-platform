global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ybb-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['ybb-api:4000']

  - job_name: 'ybb-payment'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ybb-payment:8002']

  - job_name: 'ybb-file'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ybb-file:8001']

  - job_name: 'ybb-notification'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ybb-notification:4002']
