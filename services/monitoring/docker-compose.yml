services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ybb-prometheus
    restart: unless-stopped
    user: root
    entrypoint: [ "/etc/prometheus/docker-entrypoint.sh" ]
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus" ]
    environment:
      API_HOST: ${API_HOST:-host.docker.internal}
      API_PORT: ${API_PORT:-4000}
      PAYMENT_HOST: ${PAYMENT_HOST:-host.docker.internal}
      PAYMENT_PORT: ${PAYMENT_PORT:-8002}
      FILE_HOST: ${FILE_HOST:-host.docker.internal}
      FILE_PORT: ${FILE_PORT:-8001}
      NOTIFICATION_HOST: ${NOTIFICATION_HOST:-host.docker.internal}
      NOTIFICATION_PORT: ${NOTIFICATION_PORT:-4002}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-15692}
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml.tpl
      - ./prometheus/docker-entrypoint.sh:/etc/prometheus/docker-entrypoint.sh
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: ybb-grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Datasource Configuration
      DB_HOST_API: ${DB_HOST_API:-host.docker.internal}
      DB_PORT_API: ${DB_PORT_API:-5438}
      DB_NAME_API: ${DB_NAME_API:-ybb_platform}
      DB_HOST_PAYMENT: ${DB_HOST_PAYMENT:-host.docker.internal}
      DB_PORT_PAYMENT: ${DB_PORT_PAYMENT:-5433}
      DB_USER: ${DB_USER:-ybb_user}
      DB_PASSWORD: ${DB_PASSWORD:-ybb_password}
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.0.0
    container_name: ybb-loki
    restart: unless-stopped
    user: root
    ports:
      - "3110:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki

  tempo:
    image: grafana/tempo:2.4.1
    container_name: ybb-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317" # OTLP gRPC

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: ybb-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
