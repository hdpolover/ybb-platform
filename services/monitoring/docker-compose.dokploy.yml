services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ybb-prod-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - dokploy-network

  grafana:
    image: grafana/grafana:latest
    container_name: ybb-prod-grafana
    restart: always
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ybb-prod-grafana.rule=${APP_DOMAINS_RULE:-Host(`monitor.ybbhub.com`)}"
      - "traefik.http.routers.ybb-prod-grafana.entrypoints=websecure"
      - "traefik.http.routers.ybb-prod-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.ybb-prod-grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:3.0.0
    container_name: ybb-prod-loki
    restart: always
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    networks:
      - dokploy-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: ybb-prod-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    networks:
      - dokploy-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: ybb-prod-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otel-collector-config.yaml
    networks:
      - dokploy-network
    depends_on:
      - tempo

networks:
  dokploy-network:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
