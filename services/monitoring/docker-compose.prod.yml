services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ybb-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml.tpl
      - ./prometheus/docker-entrypoint.sh:/etc/prometheus/docker-entrypoint.sh
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/etc/prometheus/docker-entrypoint.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    env_file:
      - .env.prod
    ports:
      - "9090:9090"
    networks:
      - ybb-network

  grafana:
    image: grafana/grafana:latest
    container_name: ybb-grafana
    restart: always
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    env_file:
      - .env.prod
    networks:
      - ybb-network
    ports:
      - "3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.ybbhub.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  ybb-network:
    name: ybb-network
    external: true

volumes:
  prometheus_data:
  grafana_data:
