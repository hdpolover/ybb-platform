version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ybb-shared-rabbitmq
    restart: always
    ports:
      - "5672:5672" # Optional to expose if needed by services outside dokploy network (unlikely)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ybb-rabbitmq.rule=${APP_DOMAINS_RULE:-Host(`queue.ybbhub.com`)}"
      - "traefik.http.routers.ybb-rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.ybb-rabbitmq.tls.certresolver=letsencrypt"
      - "traefik.http.services.ybb-rabbitmq.loadbalancer.server.port=15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  dokploy-network:
    external: true

volumes:
  rabbitmq_data:
