services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ybb-prod-shared-rabbitmq
    restart: always
    deploy:
      resources:
        limits:
          # The broker was the last unbounded service on the host. Its own
          # vm_memory_high_watermark defaults to 0.4 of *available* memory,
          # which with no container limit resolved to 13.46 GB: a backlog
          # could have grown into a third of the host before the broker
          # applied any back-pressure at all.
          #
          # These two settings are coupled, and getting only one of them
          # right is worse than neither. The watermark is where RabbitMQ
          # BLOCKS PUBLISHERS; the container limit is where the kernel KILLS
          # the process. If the limit sits below the watermark, the broker
          # never throttles and simply dies instead, taking every consumer
          # channel with it. RabbitMQ 3.13 reads the cgroup limit and
          # recomputes the relative watermark from it, so 1G here puts the
          # watermark at ~400M and leaves ~600M of slack above it. Verify
          # after deploy with `rabbitmqctl status`: the "computed to" figure
          # must drop to ~0.4 gb. If it still reports the host figure, pin
          # vm_memory_high_watermark.absolute in a conf file instead.
          memory: 1G
    ports:
      - "5672:5672" # Optional to expose if needed by services outside dokploy network (unlikely)
      # Management UI, LOOPBACK ONLY — not routable from the internet, and the
      # host firewall is not what is protecting it: the bind address is.
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dokploy-network
    # NOT exposed through Traefik. The management UI used to answer on
    # queue.ybbhub.com, which has no public DNS record — so its only protection
    # was that the hostname was unpublished, while the name sits in this file in
    # a public repo. It answered to anyone sending that Host header at the origin
    # IP (audit N1).
    #
    # Nothing loses access: every service reaches the broker over the internal
    # docker network as amqp://...@ybb-prod-shared-rabbitmq:5672/, never by
    # hostname. For the human management UI, tunnel it:
    #   ssh -L 15672:127.0.0.1:15672 ybb-vps   then open http://localhost:15672
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  init-rabbitmq:
    image: python:3.9-alpine
    container_name: ybb-prod-init-rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    networks:
      - dokploy-network
    command: >
      sh -c "pip install -r scripts/requirements.txt && python scripts/init_rabbitmq.py"

networks:
  dokploy-network:
    external: true

volumes:
  rabbitmq_data:
