# services/shared-rabbitmq/90-memory.conf
#
# Pins the memory high watermark ABSOLUTELY, because relative did not work.
#
# RabbitMQ 3.13 is documented to read the cgroup memory limit and compute the
# relative watermark from it. On this host it does not: after the container
# limit went to 1G (PR #210), `rabbitmqctl status` still reported
#   Memory high watermark setting: 0.4 of available memory, computed to: 13.4615 gb
# which is 40% of the HOST's 31GB, not of the container's 1G.
#
# That combination is worse than having no limit at all. The watermark is the
# point where RabbitMQ blocks publishers to save itself; the container limit is
# the point where the kernel kills it. With the watermark above the limit the
# broker never throttles, so a backlog walks straight past 1G and the process is
# OOM-killed, taking all consumer channels with it.
#
# 600MB against the 1G container limit leaves ~424MB of headroom above the
# throttle point for the Erlang VM's own overhead, which the watermark does not
# account for. The broker idles at ~149MB, so this is roughly 4x normal usage.
#
# If the container limit in docker-compose.dokploy.yml is ever changed, CHANGE
# THIS TOO. They are two halves of one setting. Verify with:
#   docker exec ybb-prod-shared-rabbitmq rabbitmqctl status | grep -i watermark
vm_memory_high_watermark.absolute = 600MB
