version: "3.8"

services:
  minimal-admin:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-minimal-admin
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ybb-minimal-admin.rule=${APP_DOMAINS_RULE:-Host(`staging-ops.ybbhub.com`)}"
      - "traefik.http.routers.ybb-minimal-admin.entrypoints=websecure"
      - "traefik.http.routers.ybb-minimal-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.ybb-minimal-admin.loadbalancer.server.port=4003"

networks:
  dokploy-network:
    external: true
