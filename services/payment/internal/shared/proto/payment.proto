syntax = "proto3";

package payment;

option go_package = "github.com/ybb-platform/payment/internal/infrastructure/grpc/proto";

service PaymentService {
  // Create a payment intent (an order to pay)
  rpc CreateIntent (CreateIntentRequest) returns (CreateIntentResponse) {}

  // Get available payment methods based on amount/currency
  rpc GetPaymentMethods (GetPaymentMethodsRequest) returns (GetPaymentMethodsResponse) {}

  // Process a payment (charge) using a token from the frontend
  rpc ProcessPayment (ProcessPaymentRequest) returns (ProcessPaymentResponse) {}

  // Manual Payment Support
  rpc SubmitManualPayment (SubmitManualPaymentRequest) returns (SubmitManualPaymentResponse) {}
  rpc VerifyManualPayment (VerifyManualPaymentRequest) returns (VerifyManualPaymentResponse) {}

  // Get intents by reference
  rpc GetIntentsByReference (GetIntentsByReferenceRequest) returns (GetIntentsByReferenceResponse) {}

  // Admin: Payment Method Management
  rpc AdminCreatePaymentMethod (AdminCreatePaymentMethodRequest) returns (AdminCreatePaymentMethodResponse) {}
  rpc AdminUpdatePaymentMethod (AdminUpdatePaymentMethodRequest) returns (AdminUpdatePaymentMethodResponse) {}
  rpc AdminDeletePaymentMethod (AdminDeletePaymentMethodRequest) returns (AdminDeletePaymentMethodResponse) {}
  rpc AdminGetPaymentMethod (AdminGetPaymentMethodRequest) returns (AdminGetPaymentMethodResponse) {}
  rpc AdminListPaymentMethods (AdminListPaymentMethodsRequest) returns (AdminListPaymentMethodsResponse) {}
}

message GetIntentsByReferenceRequest {
  string reference_type = 1;
  string reference_id = 2;
}

message PaymentIntent {
  string id = 1;
  string user_id = 2;
  int64 amount = 3;
  string currency = 4;
  string status = 5;
  string created_at = 6;
  string reference_type = 7;
  string reference_id = 8;
  map<string, string> metadata = 9;

  // Snapshots of customer/item details
  string customer_name = 10;
  string customer_email = 11;
  string customer_phone = 12;
  string description = 13;
  repeated ItemDetail item_details = 14;
}

message ItemDetail {
    string id = 1;
    string name = 2;
    int64 price = 3;
    int32 quantity = 4;
    string brand = 5;
    string category = 6;
    string merchant_name = 7;
}

message GetIntentsByReferenceResponse {
  repeated PaymentIntent intents = 1;
}

message CreateIntentRequest {
  string user_id = 1;
  string participant_id = 2; // Optional
  int64 amount = 3;
  string currency = 4;
  string reference_type = 5;
  string reference_id = 6;
  map<string, string> metadata = 7;

  // Customer Info
  string customer_name = 8;
  string customer_email = 9;
  string customer_phone = 10;

  // Item Details
  string description = 11;
  repeated ItemDetail item_details = 12;
}

message CreateIntentResponse {
  string intent_id = 1;
  string client_secret = 2; // Might be needed for some gateways, or empty
  string status = 3;
}

message SubmitManualPaymentRequest {
    string intent_id = 1;
    string proof_file_id = 2; // optional if just using URL
    string proof_file_url = 3;
    string details = 4; // notes from user
}

message SubmitManualPaymentResponse {
    string status = 1; // "PENDING_REVIEW"
    string transaction_id = 2;
}

message VerifyManualPaymentRequest {
    string transaction_id = 1;
    string status = 2; // "SUCCESS", "FAILED"
    string admin_id = 3;
    string reason = 4;
}

message VerifyManualPaymentResponse {
    string status = 1;
}

message GetPaymentMethodsRequest {
  int64 amount = 1;
  string currency = 2;
}

message PaymentMethod {
  string id = 1;
  string name = 2;
  string category = 3; // e.g., "bank_transfer", "credit_card", "ewallet"
  string image_url = 4;
  
  // Fee details for user display
  double estimated_fee = 5; 
  bool is_surcharge = 6; // If true, UI should show "Fee: X" and "Total: Amount + Fee"
}

message GetPaymentMethodsResponse {
  repeated PaymentMethod methods = 1;
}

message PaymentDetails {
    // Arbitrary JSON string for gateway specific details
    string details_json = 1; 
}

message ProcessPaymentRequest {
  string intent_id = 1;
  string payment_method_id = 2;
  string gateway_token = 3; // Token from Midtrans/Xendit JS SDK
  PaymentDetails payment_details = 4;
  string user_id = 5; // Caller's user ID for ownership verification
}

message ProcessPaymentAction {
    string type = 1; // "redirect", "display_qr", "none"
    string url = 2;
    string qr_string = 3;
}

message ProcessPaymentResponse {
  string status = 1; // "PENDING", "SUCCESS", "FAILED"
  string transaction_id = 2;
  ProcessPaymentAction action = 3;
}

message FeeConfig {
  double fixed_fee = 1;
  double percentage_fee = 2;
  double min_fee = 3;
  string currency = 4;
  bool is_surcharge = 5;
}

message AdminPaymentMethod {
  string id = 1;
  string name = 2; // Internal name
  string type = 3; // "automatic", "manual"
  string code = 4; // "bca_va"
  bool is_active = 5;
  string display_name = 6;
  string description = 7;
  string icon = 8;
  
  string gateway_name = 9; // "midtrans"
  string gateway_type = 10; // "bank_transfer"

  // Manual fields
  string bank_name = 11;
  string account_number = 12;
  string account_name = 13;
  string instructions = 14;
  bool requires_proof = 15;
  string admin_instructions = 16;

  FeeConfig config = 17;
  int32 sort_order = 18;
}

message AdminCreatePaymentMethodRequest {
  string name = 1;
  string type = 2;
  string code = 3;
  bool is_active = 4;
  string display_name = 5;
  string description = 6;
  string icon = 7;
  string gateway_name = 8;
  string gateway_type = 9;
  string bank_name = 10;
  string account_number = 11;
  string account_name = 12;
  string instructions = 13;
  bool requires_proof = 14;
  string admin_instructions = 15;
  FeeConfig config = 16;
  int32 sort_order = 17;
}

message AdminCreatePaymentMethodResponse {
  string id = 1;
}

message AdminUpdatePaymentMethodRequest {
  string id = 1;
  string name = 2;
  string type = 3;
  string code = 4;
  bool is_active = 5;
  string display_name = 6;
  string description = 7;
  string icon = 8;
  string gateway_name = 9;
  string gateway_type = 10;
  string bank_name = 11;
  string account_number = 12;
  string account_name = 13;
  string instructions = 14;
  bool requires_proof = 15;
  string admin_instructions = 16;
  FeeConfig config = 17;
  int32 sort_order = 18;
}

message AdminUpdatePaymentMethodResponse {
  string id = 1;
}

message AdminDeletePaymentMethodRequest {
  string id = 1;
}

message AdminDeletePaymentMethodResponse {
  bool success = 1;
}

message AdminGetPaymentMethodRequest {
  string id = 1;
}

message AdminGetPaymentMethodResponse {
  AdminPaymentMethod method = 1;
}

message AdminListPaymentMethodsRequest {}

message AdminListPaymentMethodsResponse {
  repeated AdminPaymentMethod methods = 1;
}
