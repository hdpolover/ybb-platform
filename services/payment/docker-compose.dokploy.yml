services:
  payment:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-prod-payment
    restart: always
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      GIN_MODE: ${GIN_MODE:-release}
      PORT: 8002
      # Database
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@ybb-prod-postgres-payment:5432/${DATABASE_NAME}?sslmode=disable
      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@ybb-prod-shared-rabbitmq:5672/
      # Gateways
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: "${MIDTRANS_IS_PRODUCTION:-true}"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      # Observability
      LOKI_URL: ${LOKI_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      # Payment Service
      PAYMENT_SECRETS_KEY: ${PAYMENT_SECRETS_KEY}
      # PAYMENT_AUTO_MIGRATE intentionally unset — SQL migrations are authoritative
    depends_on:
      postgres-payment:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ybb-prod-payment.rule=${APP_DOMAINS_RULE:-Host(`payments.ybbhub.com`)}"
      - "traefik.http.routers.ybb-prod-payment.entrypoints=websecure"
      - "traefik.http.routers.ybb-prod-payment.tls.certresolver=letsencrypt"
      - "traefik.http.services.ybb-prod-payment.loadbalancer.server.port=8002"
      # Audit M208: /swagger and /metrics answered 200 to anyone on
      # payments.ybbhub.com — the full API surface (including /payments/{id}/verify
      # and /payments/{id}/proof) plus Go runtime metrics, verified live.
      #
      # Blocked at the EDGE rather than in the handler, deliberately: Prometheus
      # scrapes the internal docker hostname (ybb-payment:8002, see
      # services/monitoring/prometheus/prometheus.prod.yml) and never goes through
      # Traefik, so an edge rule closes the public hole without touching internal
      # scraping. Gating the route in Go would have blocked the scraper too.
      #
      # The host rule itself has to stay: the API keeps
      # PAYMENT_SERVICE_FALLBACK_URL=https://payments.ybbhub.com as its fallback
      # path, so dropping it entirely is not free.
      #
      # Traefik has no "deny" middleware; an ipallowlist that only permits
      # loopback is the idiomatic way to express one, since no public request can
      # ever present that source. `ipallowlist` is the Traefik v3 spelling — this
      # fleet runs v3.6.1; on v2 it would be `ipwhitelist`.
      #
      # APP_DOMAINS_RULE is parenthesised before the && so that a value
      # containing a top-level || (e.g. two Host rules) cannot bind more tightly
      # than intended and silently narrow this router to one of them.
      - "traefik.http.middlewares.ybb-prod-payment-deny.ipallowlist.sourcerange=127.0.0.1/32"
      - "traefik.http.routers.ybb-prod-payment-internal.rule=(${APP_DOMAINS_RULE:-Host(`payments.ybbhub.com`)}) && (PathPrefix(`/swagger`) || PathPrefix(`/metrics`))"
      - "traefik.http.routers.ybb-prod-payment-internal.entrypoints=websecure"
      - "traefik.http.routers.ybb-prod-payment-internal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ybb-prod-payment-internal.priority=100"
      - "traefik.http.routers.ybb-prod-payment-internal.middlewares=ybb-prod-payment-deny"
      - "traefik.http.routers.ybb-prod-payment-internal.service=ybb-prod-payment"

  postgres-payment:
    image: postgres:15-alpine
    container_name: ybb-prod-postgres-payment
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # Observability only — this DB is tiny, no memory tuning needed. See
    # "Postgres tuning" section in DOCKPLOY_DEPLOYMENT.md.
    command:
      [
        "postgres",
        "-c", "track_io_timing=on",
        "-c", "shared_preload_libraries=pg_stat_statements",
        "-c", "pg_stat_statements.track=all"
      ]
    volumes:
      - postgres_payment_data_prod_v2:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Daily local dump of postgres-payment into the postgres_payment_backups
  # volume on this VPS (7 daily / 4 weekly / 3 monthly, pruned by the image
  # itself). This is on-host only, not off-site. To add off-site sync later,
  # point an AWS_* / rclone sidecar at this same named volume, or swap this
  # image for one with S3 upload support (e.g. set
  # AWS_S3_BUCKET/AWS_ACCESS_KEY_ID/etc if a fork with S3 support is adopted).
  postgres-payment-backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ybb-prod-postgres-payment
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - postgres_payment_backups:/backups
    depends_on:
      postgres-payment:
        condition: service_healthy
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  postgres_payment_data_prod_v2:
  postgres_payment_backups:
