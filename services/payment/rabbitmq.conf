# RabbitMQ Configuration

# Networking
listeners.tcp.default = 5672

# Management plugin
management.tcp.port = 15672

# Memory
vm_memory_high_watermark.relative = 0.6

# Disk space
disk_free_limit.relative = 1.0

# Logging
log.console = true
log.console.level = info

# Default user (change in production)
default_user = guest
default_pass = guest

# Default vhost
default_vhost = /
