services:
  # =========================================
  # Payment Service (Staging)
  # =========================================
  payment:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-payment-staging
    restart: always
    env_file:
      - .env.staging
    ports:
      - "8002:8002"
    depends_on:
      postgres-payment:
        condition: service_healthy
    networks:
      - ybb-network-staging

  postgres-payment:
    image: postgres:15-alpine
    container_name: ybb-postgres-payment-staging
    restart: always
    env_file:
      - .env.staging
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data_staging:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - ybb-network-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ybb-network-staging:
    name: ybb-network-staging
    external: true

volumes:
  postgres_payment_data_staging:
