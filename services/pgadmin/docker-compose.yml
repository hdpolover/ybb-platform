services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ybb-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data_local:/var/lib/pgadmin
      - ./servers.local.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    networks:
      - default

volumes:
  pgadmin_data_local:
