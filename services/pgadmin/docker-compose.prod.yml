services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ybb-pgadmin-prod
    restart: always
    env_file:
      - .env.prod
    environment:
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.prod.json:/pgadmin4/servers.json:ro
    networks:
      - ybb-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`db.ybbhub.com`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

networks:
  ybb-network:
    name: ybb-network
    external: true

volumes:
  pgadmin_data:
