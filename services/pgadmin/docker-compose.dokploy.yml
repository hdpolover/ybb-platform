services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ybb-prod-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # Inject servers.json if possible, or manual config.
      # For Dockploy, mounting a file from repo is tricky if not in build context.
      # We just mount the local one assuming it's copied or volume mounted.
      # Ideally, you'd build a custom image with the config or use a volume.
      # For simplicity here, we rely on manual setup or volume persistence.
    volumes:
      - pgadmin_data_prod:/var/lib/pgadmin
      - ./servers.staging.json:/pgadmin4/servers.json:ro
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ybb-prod-pgadmin.rule=${APP_DOMAINS_RULE:-Host(`db.ybbhub.com`)}"
      - "traefik.http.routers.ybb-prod-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.ybb-prod-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.ybb-prod-pgadmin.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true

volumes:
  pgadmin_data_prod:
