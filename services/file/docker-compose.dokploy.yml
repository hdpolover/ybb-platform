services:
  file:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-prod-file
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
    environment:
      PYTHON_ENV: production
      SERVICE_PORT: 8001
      # Database
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@ybb-prod-postgres-file:5432/${DATABASE_NAME}
      # MinIO (External or Staging)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_REGION: ${MINIO_REGION:-sgp1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "true"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: "true"
      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@ybb-prod-shared-rabbitmq:5672/
      # Service Configuration
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY}
      CERTIFICATE_VERIFICATION_URL: ${CERTIFICATE_VERIFICATION_URL}
      FILE_SERVICE_INTERNAL_KEY: ${FILE_SERVICE_INTERNAL_KEY}
      # Observability
      LOKI_URL: ${LOKI_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
    depends_on:
      postgres-file:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ybb-prod-file.rule=${APP_DOMAINS_RULE:-Host(`files.ybbhub.com`)}"
      - "traefik.http.routers.ybb-prod-file.entrypoints=websecure"
      - "traefik.http.routers.ybb-prod-file.tls.certresolver=letsencrypt"
      - "traefik.http.services.ybb-prod-file.loadbalancer.server.port=8001"
      - "traefik.http.routers.ybb-prod-file.service=ybb-prod-file"

  # Filestash (S3 Browser for DigitalOcean Spaces)
  filestash:
    image: machines/filestash:latest
    container_name: ybb-prod-filestash
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      # Loopback only — reachable through an SSH tunnel, never from the internet.
      - "127.0.0.1:8334:8334"
    environment:
      - APPLICATION_URL=http://localhost:8334
    volumes:
      - filestash_data:/app/data/state/
    networks:
      - dokploy-network
    # NOT exposed through Traefik, same reasoning as the RabbitMQ UI above:
    # console.ybbhub.com had no public DNS record but answered on the origin IP
    # to anyone sending that Host header, and the name is in this file in a
    # public repo (audit N1). No application code ever used the hostname — this
    # is a human storage browser only. Reach it with:
    #   ssh -L 8334:127.0.0.1:8334 ybb-vps   then open http://localhost:8334
    labels:
      - "traefik.enable=false"

  postgres-file:
    image: postgres:15-alpine
    container_name: ybb-prod-postgres-file
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # Observability only — this DB is tiny, no memory tuning needed. See
    # "Postgres tuning" section in DOCKPLOY_DEPLOYMENT.md.
    command:
      [
        "postgres",
        "-c", "track_io_timing=on",
        "-c", "shared_preload_libraries=pg_stat_statements",
        "-c", "pg_stat_statements.track=all"
      ]
    volumes:
      - postgres_file_data_prod:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Daily local dump of postgres-file into the postgres_file_backups volume
  # on this VPS (7 daily / 4 weekly / 3 monthly, pruned by the image itself).
  # This is on-host only, not off-site. To add off-site sync later, point an
  # AWS_* / rclone sidecar at this same named volume, or swap this image for
  # one with S3 upload support (e.g. set AWS_S3_BUCKET/AWS_ACCESS_KEY_ID/etc
  # if a fork with S3 support is adopted).
  postgres-file-backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ybb-prod-postgres-file
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - postgres_file_backups:/backups
    depends_on:
      postgres-file:
        condition: service_healthy
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  postgres_file_data_prod:
  filestash_data:
  postgres_file_backups:
