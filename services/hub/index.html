<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#131f49">
  <title>Choose your program - Youth Break the Boundaries</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preload" href="/fonts/poppins-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="lockup"><img class="mark" src="/ybb-logo-white.png" width="68" height="56" alt=""><span>Youth Break the Boundaries</span></p>
      <h1>Which program are you in?</h1>
      <p id="sub" class="sub">Choose your program to go to its participant portal.</p>
    </div>
  </header>
  <main class="wrap">
    <p id="status" class="sr-only" role="status"></p>
    <div id="out">
      <ul class="grid" aria-hidden="true">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ul>
    </div>
    <noscript>
      <div class="notice">
        <p class="notice-title">This page needs JavaScript to list the programs.</p>
        <a class="link" href="https://youthbreaktheboundaries.com">Go to youthbreaktheboundaries.com</a>
      </div>
    </noscript>
    <p class="hint">Not sure which one? The program name is in the emails we sent you, and you sign in on that program's site.</p>
  </main>
  <footer class="foot">
    <a href="https://youthbreaktheboundaries.com">youthbreaktheboundaries.com</a>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
