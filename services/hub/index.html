<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#11131c">
  <title>Choose your program - Youth Break the Boundaries</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e62c4f'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle' fill='white'%3EYBB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="lockup"><span class="mark" aria-hidden="true">YBB</span>Youth Break the Boundaries</p>
      <h1>Which program are you in?</h1>
      <p id="sub" class="sub">Choose your program to go to its participant portal.</p>
    </div>
  </header>
  <main class="wrap">
    <p id="status" class="sr-only" role="status"></p>
    <div id="out">
      <ul class="grid" aria-hidden="true">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ul>
    </div>
    <noscript>
      <div class="notice">
        <p class="notice-title">This page needs JavaScript to list the programs.</p>
        <a class="link" href="https://youthbreaktheboundaries.com">Go to youthbreaktheboundaries.com</a>
      </div>
    </noscript>
    <p class="hint">Not sure which one? The program name is in the emails we sent you, and you sign in on that program's site.</p>
  </main>
  <footer class="foot">
    <a href="https://youthbreaktheboundaries.com">youthbreaktheboundaries.com</a>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
