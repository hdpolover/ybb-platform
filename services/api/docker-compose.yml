services:
  # =========================================
  # API Service
  # =========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ybb-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Service Links (Configured as full URLs for independence)
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./src:/app/src
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres-api:
        condition: service_healthy
      redis-api:
        condition: service_healthy
    networks:
      - default

  # =========================================
  # Dedicated Postgres for API
  # =========================================
  postgres-api:
    image: postgres:15-alpine
    container_name: ybb-postgres-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432" # Exposed on standard port (Api is primary)
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Dedicated Redis for API
  # =========================================
  redis-api:
    image: redis:7-alpine
    container_name: ybb-redis-api
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379" # Exposed on standard port
    volumes:
      - redis_api_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_api_data:
  redis_api_data:
