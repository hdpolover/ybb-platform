services:
  # =========================================
  # API Service
  # =========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ybb-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Override DATABASE_URL to use the container name instead of the host's localhost value
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres-api:5432/${DATABASE_NAME}?schema=public&connection_limit=5
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Service Links (Configured as full URLs for independence)
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      PAYMENT_SERVICE_INTERNAL_KEY: ${PAYMENT_SERVICE_INTERNAL_KEY}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RABBITMQ_URL: ${RABBITMQ_URL}
      ADMIN_REGISTRATION_SECRET: ${ADMIN_REGISTRATION_SECRET}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID}
      # Advanced Features Configuration
      READ_REPLICA_URL: ${READ_REPLICA_URL:-}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_SUCCESS_THRESHOLD: ${CIRCUIT_BREAKER_SUCCESS_THRESHOLD:-3}
      CIRCUIT_BREAKER_TIMEOUT: ${CIRCUIT_BREAKER_TIMEOUT:-60000}
      # Use the JSON file for authentication (Simpler and more robust)
      IS_DOCKER: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
      # Observability
      LOKI_URL: ${LOKI_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_LOG_LEVEL: info
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./service-account.json:/app/service-account.json
      - ../../protos:/protos
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres-api:
        condition: service_healthy
      redis-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ybb-network

  # =========================================
  # Dedicated Postgres for API
  # =========================================
  postgres-api:
    image: postgres:15-alpine
    container_name: ybb-postgres-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5438:5432" # Exposed on standard port (Api is primary)
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Dedicated Redis for API
  # =========================================
  redis-api:
    image: redis:7-alpine
    container_name: ybb-redis-api
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379" # Exposed on 6380 to avoid conflict with local redis
    volumes:
      - redis_api_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_api_data:
  redis_api_data:

networks:
  ybb-network:
    name: ybb-network
    external: true
