syntax = "proto3";

package common;

option go_package = "github.com/hdpolover/ybb-platform/shared/proto";

// Common message types shared across services

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
}

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
  int64 uptime = 3;
}
