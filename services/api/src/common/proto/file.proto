syntax = "proto3";

package file;

option go_package = "github.com/hdpolover/ybb-platform/services/file-service/api/proto";

// File service definition
service FileService {
  rpc UploadFile(stream UploadFileRequest) returns (FileResponse);
  rpc GetFile(GetFileRequest) returns (FileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
}

// Messages
message UploadFileRequest {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message FileMetadata {
  string filename = 1;
  string content_type = 2;
  int64 size = 3;
  string user_id = 4;
  string entity_type = 5;
  string entity_id = 6;
}

message GetFileRequest {
  string file_id = 1;
}

message DeleteFileRequest {
  string file_id = 1;
}

message ListFilesRequest {
  string user_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message FileResponse {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size = 4;
  string url = 5;
  string user_id = 6;
  string entity_type = 7;
  string entity_id = 8;
  string storage_path = 9;
  string created_at = 10;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message ListFilesResponse {
  repeated FileResponse files = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
