# DATABASE_HOST selects which Postgres this stack talks to. It MUST be set:
# production points at the standalone Dokploy Postgres service
# (ybb-platform-postgres-api-...), because holding the production database
# inside this compose project meant one Delete click in the panel destroyed it.
#
# Until 2026-09-18 this file also defined a `postgres-api` service and defaulted
# DATABASE_HOST to it, kept as the rollback for that 2026-09-10 extraction. It
# has been removed, because it had stopped being a rollback and become a hazard:
# its data froze at the moment of the extraction, so pointing back at it would
# serve stale data AS production, while it kept running as a byte-plausible copy
# of the live database under the SAME database name and credentials on the same
# host. A session mistook it for production and ran every analytical query
# against week-old data before the mismatch surfaced.
#
# There is deliberately no default now: an unset DATABASE_HOST fails the deploy
# loudly instead of silently resolving to something that is not production.
# The old data volume (postgres_api_data_prod) is NOT deleted by this change; it
# stays on disk until someone removes it explicitly.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    # No ports exposed to host, only via Traefik
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST:?DATABASE_HOST must be set}:5432/${DATABASE_NAME}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@${REDIS_HOST:-ybb-platform-redis-service-omv9vw}:6379
      REDIS_HOST: ${REDIS_HOST:-ybb-platform-redis-service-omv9vw}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Links to other services (on same dokploy-network)
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      PAYMENT_SERVICE_FALLBACK_URL: ${PAYMENT_SERVICE_FALLBACK_URL}
      PAYMENT_SERVICE_INTERNAL_KEY: ${PAYMENT_SERVICE_INTERNAL_KEY}
      PAYMENT_GRPC_URL: ${PAYMENT_GRPC_URL}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      FILE_SERVICE_INTERNAL_KEY: ${FILE_SERVICE_INTERNAL_KEY}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Without these the API sends no Authorization header to the landing
      # app's revalidate hooks, every call 401s, LandingRevalidationService
      # swallows the failure, and brand/program content edits stay invisible
      # publicly until the 1h snapshot TTL expires. The values were already
      # configured in Dokploy; they were simply never mapped into the
      # container, so the process could not see them.
      SETTINGS_REVALIDATE_SECRET: ${SETTINGS_REVALIDATE_SECRET}
      HOME_REVALIDATE_SECRET: ${HOME_REVALIDATE_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@ybb-prod-shared-rabbitmq:5672/
      RABBITMQ_QUEUE_CLEANUP_ON_DEPLOY: ${RABBITMQ_QUEUE_CLEANUP_ON_DEPLOY:-false}
      # NOTE: api-service-payment-events must NOT be a cleanup target. Purging it
      # drops in-flight payment.succeeded events, which silently leaves paid invoices
      # stuck unpaid and blocks application submission. Reconciliation is the safety net.
      RABBITMQ_QUEUE_CLEANUP_TARGETS: ${RABBITMQ_QUEUE_CLEANUP_TARGETS:-audit_log_queue,reporting_queue}
      RABBITMQ_QUEUE_CLEANUP_INCLUDE_RETRY_DLQ: ${RABBITMQ_QUEUE_CLEANUP_INCLUDE_RETRY_DLQ:-true}
      # Optional overrides for RabbitMQ Management API used by cleanup script
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-}
      RABBITMQ_MANAGEMENT_USER: ${RABBITMQ_MANAGEMENT_USER:-}
      RABBITMQ_MANAGEMENT_PASS: ${RABBITMQ_MANAGEMENT_PASS:-}
      RABBITMQ_MANAGEMENT_VHOST: ${RABBITMQ_MANAGEMENT_VHOST:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_REGISTRATION_SECRET: ${ADMIN_REGISTRATION_SECRET}
      # Rate Limiting
      THROTTLE_SHORT_LIMIT: ${THROTTLE_SHORT_LIMIT:-20}
      THROTTLE_MEDIUM_LIMIT: ${THROTTLE_MEDIUM_LIMIT:-100}
      THROTTLE_LONG_LIMIT: ${THROTTLE_LONG_LIMIT:-300}
      # gRPC
      FILE_GRPC_URL: ${FILE_GRPC_URL:-ybb-prod-file:50052}
      # Firebase Admin
      # Option 1: Full JSON in Env Var (Recommended for Dokploy)
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      # Firebase Client
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID}
      # Advanced Features Configuration
      READ_REPLICA_URL: ${READ_REPLICA_URL:-}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_SUCCESS_THRESHOLD: ${CIRCUIT_BREAKER_SUCCESS_THRESHOLD:-3}
      CIRCUIT_BREAKER_TIMEOUT: ${CIRCUIT_BREAKER_TIMEOUT:-60000}
      # Ops alerts (pricing-tier coverage cron) - comma-separated recipient list.
      # Must be listed here or the value set in the Dokploy panel never reaches
      # the container (same gap that broke SETTINGS_REVALIDATE_SECRET above).
      OPS_ALERT_EMAILS: ${OPS_ALERT_EMAILS}
      # Observability
      LOKI_URL: ${LOKI_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      # Release tasks run once, in api-release below, not on every boot.
      SKIP_RELEASE_TASKS: "true"
    depends_on:
      api-release:
        condition: service_completed_successfully
    # Readiness is defined ONCE, as a HEALTHCHECK in Dockerfile.prod, so compose
    # and Swarm cannot disagree about what "ready" means. Swarm reads health from
    # the image, so it has to live there; repeating it here would be a second
    # source of truth for the same thing.
    networks:
      - dokploy-network
    # Dokploy handles Traefik labels and SSL termination automatically via the UI

  # One-shot: queue cleanup, prisma migrate deploy, reference seed — then exits.
  # The api service waits on it completing successfully, so ordering is
  # unchanged; what changes is that this work happens ONCE per deploy instead of
  # once per container start, and is not sitting in front of the port opening.
  #
  # Same build as api, so the image is built once and reused rather than pulled
  # or rebuilt separately.
  api-release:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST:?DATABASE_HOST must be set}:5432/${DATABASE_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@ybb-prod-shared-rabbitmq:5672/
      RABBITMQ_QUEUE_CLEANUP_ON_DEPLOY: ${RABBITMQ_QUEUE_CLEANUP_ON_DEPLOY:-false}
      RABBITMQ_QUEUE_CLEANUP_TARGETS: ${RABBITMQ_QUEUE_CLEANUP_TARGETS:-audit_log_queue,reporting_queue}
      RABBITMQ_QUEUE_CLEANUP_INCLUDE_RETRY_DLQ: ${RABBITMQ_QUEUE_CLEANUP_INCLUDE_RETRY_DLQ:-true}
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-}
      RABBITMQ_MANAGEMENT_USER: ${RABBITMQ_MANAGEMENT_USER:-}
      RABBITMQ_MANAGEMENT_PASS: ${RABBITMQ_MANAGEMENT_PASS:-}
      RABBITMQ_MANAGEMENT_VHOST: ${RABBITMQ_MANAGEMENT_VHOST:-}
      RUN_SEED: ${RUN_SEED:-false}
    # The entrypoint runs the release tasks and then execs this, so the
    # container exits 0 as soon as they finish.
    command: ["node", "-e", "process.exit(0)"]
    networks:
      - dokploy-network

  # Daily local dump of whatever DATABASE_HOST points at (the standalone
  # Postgres service) into the postgres_api_backups volume on
  # this VPS (7 daily / 4 weekly / 3 monthly, pruned by the image itself).
  # This is on-host only, not off-site. To add off-site sync later, point an
  # AWS_* / rclone sidecar at this same named volume, or swap this image for
  # one with S3 upload support (e.g. set AWS_S3_BUCKET/AWS_ACCESS_KEY_ID/etc
  # if a fork with S3 support is adopted).
  postgres-api-backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    environment:
      # Follows DATABASE_HOST too: after the 2026-09-10 extraction the database
      # this stack must back up is no longer the postgres-api container defined
      # below. A backup sidecar still pointed at the old host backs up a frozen
      # copy while the live database goes unbacked - which inverts the whole
      # point of the move.
      POSTGRES_HOST: ${DATABASE_HOST:?DATABASE_HOST must be set}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - postgres_api_backups:/backups
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  postgres_api_data_prod:
  postgres_api_backups:
