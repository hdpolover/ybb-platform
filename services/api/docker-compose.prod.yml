services:
  # =========================================
  # API Service (Production)
  # =========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ybb-api
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    # Advanced features env vars (READ_REPLICA_URL, CIRCUIT_BREAKER_*) should be set in .env.prod
    depends_on:
      postgres-api:
        condition: service_healthy
      redis-api:
        condition: service_healthy
    networks:
      - ybb-network

  postgres-api:
    image: postgres:15-alpine
    container_name: ybb-postgres-api
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
    networks:
      - ybb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-api:
    image: redis:7-alpine
    container_name: ybb-redis-api
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_api_data:/data
    networks:
      - ybb-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ybb-network:
    name: ybb-network
    external: true

volumes:
  postgres_api_data:
  redis_api_data:
