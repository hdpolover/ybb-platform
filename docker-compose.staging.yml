services:
  # =========================================
  # Database (PostgreSQL)
  # =========================================
  postgres:
    image: postgres:16-alpine
    container_name: ybb-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - ybb-network-staging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # =========================================
  # Database GUI (PgAdmin) -> db.staging.ybbhub.com
  # =========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ybb-pgadmin-staging
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@staging.ybbhub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    volumes:
      - pgadmin_data_staging:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - ybb-network-staging
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin-staging.rule=Host(`db.staging.ybbhub.com`)"
      - "traefik.http.routers.pgadmin-staging.entrypoints=websecure"
      - "traefik.http.routers.pgadmin-staging.tls.certresolver=myresolver"
      - "traefik.http.services.pgadmin-staging.loadbalancer.server.port=80"

  # =========================================
  # Cache (Redis)
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: ybb-redis-staging
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_staging:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - ybb-network-staging
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M

  # =========================================
  # Storage (MinIO) -> s3.staging.ybbhub.com & console.staging.ybbhub.com
  # =========================================
  minio:
    image: minio/minio:latest
    container_name: ybb-minio-staging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # Essential for running behind a reverse proxy (Traefik)
      MINIO_BROWSER_REDIRECT_URL: "https://console.staging.ybbhub.com"
      MINIO_SERVER_URL: "https://s3.staging.ybbhub.com"
    volumes:
      - /var/ybb-storage-staging:/data
    networks:
      - ybb-network-staging
      - web_gateway
    labels:
      - "traefik.enable=true"
      # API (S3)
      - "traefik.http.routers.minio-api-staging.rule=Host(`s3.staging.ybbhub.com`)"
      - "traefik.http.routers.minio-api-staging.entrypoints=websecure"
      - "traefik.http.routers.minio-api-staging.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-api-staging.service=minio-api-service-staging"
      - "traefik.http.services.minio-api-service-staging.loadbalancer.server.port=9000"
      # Console (Dashboard)
      - "traefik.http.routers.minio-console-staging.rule=Host(`console.staging.ybbhub.com`)"
      - "traefik.http.routers.minio-console-staging.entrypoints=websecure"
      - "traefik.http.routers.minio-console-staging.tls.certresolver=myresolver"
      - "traefik.http.routers.minio-console-staging.service=minio-console-service-staging"
      - "traefik.http.services.minio-console-service-staging.loadbalancer.server.port=9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # =========================================
  # Message Queue (RabbitMQ) -> queue.staging.ybbhub.com
  # =========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ybb-rabbitmq-staging
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data_staging:/var/lib/rabbitmq
    networks:
      - ybb-network-staging
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq-staging.rule=Host(`queue.staging.ybbhub.com`)"
      - "traefik.http.routers.rabbitmq-staging.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq-staging.tls.certresolver=myresolver"
      - "traefik.http.services.rabbitmq-staging.loadbalancer.server.port=15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # =========================================
  # API Gateway (NestJS) -> api.staging.ybbhub.com
  # =========================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.prod
    container_name: ybb-api-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRATION}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-staging.rule=Host(`api.staging.ybbhub.com`)"
      - "traefik.http.routers.api-staging.entrypoints=websecure"
      - "traefik.http.routers.api-staging.tls.certresolver=myresolver"
      - "traefik.http.services.api-staging.loadbalancer.server.port=4000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # =========================================
  # Payment Service (Go) -> payment.staging.ybbhub.com
  # =========================================
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.prod
    container_name: ybb-payment-service-staging
    restart: unless-stopped
    environment:
      PORT: 8002
      DATABASE_URL: ${DATABASE_URL_PAYMENT}
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment-staging.rule=Host(`payment.staging.ybbhub.com`)"
      - "traefik.http.routers.payment-staging.entrypoints=websecure"
      - "traefik.http.routers.payment-staging.tls.certresolver=myresolver"
      - "traefik.http.services.payment-staging.loadbalancer.server.port=8002"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # =========================================
  # File Service (Python) -> files.staging.ybbhub.com
  # =========================================
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile.prod
    container_name: ybb-file-service-staging
    restart: unless-stopped
    environment:
      PYTHON_ENV: staging
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE}
      DATABASE_URL: ${DATABASE_URL_FILE}
      SERVICE_PORT: 8001
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files-staging.rule=Host(`files.staging.ybbhub.com`)"
      - "traefik.http.routers.files-staging.entrypoints=websecure"
      - "traefik.http.routers.files-staging.tls.certresolver=myresolver"
      - "traefik.http.services.files-staging.loadbalancer.server.port=8001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # =========================================
  # Notification Service (NestJS) -> notification.staging.ybbhub.com
  # =========================================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.prod
    container_name: ybb-notification-service-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 4002
      RABBITMQ_URL: ${RABBITMQ_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification-staging.rule=Host(`notification.staging.ybbhub.com`)"
      - "traefik.http.routers.notification-staging.entrypoints=websecure"
      - "traefik.http.routers.notification-staging.tls.certresolver=myresolver"
      - "traefik.http.services.notification-staging.loadbalancer.server.port=4002"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4002/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # =========================================
  # Admin Dashboard (Next.js) -> admin.staging.ybbhub.com
  # =========================================
  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ybb-admin-dashboard-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 4001
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-staging.rule=Host(`admin.staging.ybbhub.com`)"
      - "traefik.http.routers.admin-staging.entrypoints=websecure"
      - "traefik.http.routers.admin-staging.tls.certresolver=myresolver"
      - "traefik.http.services.admin-staging.loadbalancer.server.port=4001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================
  # Minimal Admin (Next.js) -> staging-min-admin.ybbhub.com
  # =========================================
  minimal-admin:
    build:
      context: ./services/minimal-admin
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ybb-minimal-admin-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 4003
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minimal-admin-staging.rule=Host(`staging-min-admin.ybbhub.com`)"
      - "traefik.http.routers.minimal-admin-staging.entrypoints=websecure"
      - "traefik.http.routers.minimal-admin-staging.tls.certresolver=myresolver"
      - "traefik.http.services.minimal-admin-staging.loadbalancer.server.port=4003"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4003/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================
  # Landing Page / Static (Nginx) -> staging.ybbhub.com
  # =========================================
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: ybb-nginx-staging
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ybb-network-staging
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-staging.rule=Host(`staging.ybbhub.com`)"
      - "traefik.http.routers.landing-staging.entrypoints=websecure"
      - "traefik.http.routers.landing-staging.tls.certresolver=myresolver"
      - "traefik.http.services.landing-staging.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # =========================================
  # Monitoring (Prometheus)
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ybb-prometheus-staging
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_staging:/prometheus
    networks:
      - ybb-network-staging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # =========================================
  # Monitoring (Grafana) -> monitor.staging.ybbhub.com
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ybb-grafana-staging
    restart: unless-stopped
    volumes:
      - grafana_data_staging:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Ensure Grafana knows its public URL for correct redirects
      GF_SERVER_ROOT_URL: "https://monitor.staging.ybbhub.com"
      GF_SERVER_DOMAIN: "monitor.staging.ybbhub.com"
    networks:
      - ybb-network-staging
      - web_gateway
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-staging.rule=Host(`monitor.staging.ybbhub.com`)"
      - "traefik.http.routers.grafana-staging.entrypoints=websecure"
      - "traefik.http.routers.grafana-staging.tls.certresolver=myresolver"
      - "traefik.http.services.grafana-staging.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  ybb-network-staging:
    driver: bridge
  web_gateway:
    external: true

volumes:
  postgres_data_staging:
  redis_data_staging:
  rabbitmq_data_staging:
  pgadmin_data_staging:
  prometheus_data_staging:
  grafana_data_staging:
