services:
  # =========================================
  # Database (PostgreSQL)
  # =========================================
  postgres:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    container_name: ybb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - ybb-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Database GUI (PgAdmin)
  # =========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ybb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ybbhub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.staging.json:/pgadmin4/servers.json:ro
    networks:
      - ybb-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`db.ybbhub.com`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # =========================================
  # Cache (Redis)
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: ybb-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - ybb-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Message Queue (RabbitMQ) -> queue.ybbhub.com
  # =========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ybb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ybb-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`queue.ybbhub.com`)"
      - "traefik.http.routers.rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq.tls.certresolver=myresolver"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # =========================================
  # API Gateway (NestJS) -> api.ybbhub.com
  # =========================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    container_name: ybb-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRATION}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL}
      FILE_SERVICE_URL: http://file-service:8001
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "4000:4000"
    volumes:
      - ./services/api:/app
      - /app/node_modules
      - /app/dist
    networks:
      - ybb-network
    depends_on:
      # postgres:
      #   condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.ybbhub.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=4000"

  # =========================================
  # Payment Service (Go) -> payment.ybbhub.com
  # =========================================
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.dev
    container_name: ybb-payment-service
    restart: unless-stopped
    environment:
      PORT: 8002
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL_PAYMENT}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    ports:
      - "8002:8002"
    volumes:
      - ./services/payment-service:/app
    networks:
      - ybb-network
    depends_on:
      # postgres:
      #   condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment.rule=Host(`payment.ybbhub.com`)"
      - "traefik.http.routers.payment.entrypoints=websecure"
      - "traefik.http.routers.payment.tls.certresolver=myresolver"
      - "traefik.http.services.payment.loadbalancer.server.port=8002"

  # =========================================
  # File Service (Python) -> files.ybbhub.com
  # =========================================
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    container_name: ybb-file-service
    restart: unless-stopped
    environment:
      PYTHON_ENV: ${NODE_ENV:-development}
      # Point to Staging MinIO by default
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-true}
      DATABASE_URL: ${DATABASE_URL_FILE}
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./services/file-service:/app
    networks:
      - ybb-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.rule=Host(`files.ybbhub.com`)"
      - "traefik.http.routers.files.entrypoints=websecure"
      - "traefik.http.routers.files.tls.certresolver=myresolver"
      - "traefik.http.services.files.loadbalancer.server.port=8001"

  # =========================================
  # Notification Service (NestJS) -> notification.ybbhub.com
  # =========================================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
    container_name: ybb-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4002
      RABBITMQ_URL: ${RABBITMQ_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
      - /app/dist
    networks:
      - ybb-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.rule=Host(`notification.ybbhub.com`)"
      - "traefik.http.routers.notification.entrypoints=websecure"
      - "traefik.http.routers.notification.tls.certresolver=myresolver"
      - "traefik.http.services.notification.loadbalancer.server.port=4002"

  # =========================================
  # Admin Dashboard (Next.js) -> admin.ybbhub.com
  # =========================================
  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile.dev
    container_name: ybb-admin-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 4001
    ports:
      - "4001:4001"
    volumes:
      - ./services/admin-dashboard:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ybb-network
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=myresolver"
      - "traefik.http.services.admin.loadbalancer.server.port=4001"

  # =========================================
  # Minimal Admin (Next.js) -> minimal-admin
  # =========================================
  minimal-admin:
    build:
      context: ./services/minimal-admin
      dockerfile: Dockerfile.dev
    container_name: ybb-minimal-admin
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 4003
    ports:
      - "4003:4003"
    volumes:
      - ./services/minimal-admin:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ybb-network
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minimal-admin.entrypoints=websecure"
      - "traefik.http.routers.minimal-admin.tls.certresolver=myresolver"
      - "traefik.http.services.minimal-admin.loadbalancer.server.port=4003"

  # =========================================
  # Nginx removed for local development
  # Access services directly on their ports
  # =========================================

  # =========================================
  # Monitoring (Prometheus)
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ybb-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ybb-network

  # =========================================
  # Monitoring (Grafana) -> monitor.ybbhub.com
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ybb-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - ybb-network
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.ybbhub.com`)"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  ybb-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:


