name: Verify

# Runs on every PR into the branch that DEPLOYS. Until this existed there was no
# automated check anywhere between a merge and production: deploy.yml fires on
# `main`, but Dokploy deploys from `dev`, so nothing ran tsc, jest or a build for
# the code that actually shipped. On 2026-09-03 three separate fixes reached
# production with a defect a check like this would have caught, each found only
# because somebody went looking afterwards.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      # Throwaway values, needed only so things RESOLVE. Nothing in this job
      # connects to a database, a cache or an identity provider.
      #
      # DATABASE_URL: prisma.config.ts calls env('DATABASE_URL') at load time and
      # THROWS when it resolves from neither the environment nor a .env file.
      # JWT_SECRET: three bootstrap consumer-module specs build the real DI
      # graph, which constructs JwtStrategy, which fails with "requires a secret
      # or key" without it.
      #
      # This is what the first version of this workflow got wrong. It was
      # "verified" locally with `env -u DATABASE_URL`, which unsets the shell
      # variable but leaves services/api/.env in place - so Prisma and Nest both
      # still found everything and the run passed. A local run only matches CI if
      # the .env file is moved aside too, which is how these two were found.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-verify-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches services/api/Dockerfile, so CI cannot pass on a Node version
          # production does not run.
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - run: npm ci

      # No postinstall hook in this package, and 153 source files import types
      # from @prisma/client, so the client must be generated before tsc.
      # `prisma.schema` in package.json points at the multi-file prisma/schema
      # directory.
      # It generates types only - it never connects. See the job-level env for
      # why DATABASE_URL has to be present anyway.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Build before test because that is the order production starts in. This
      # used to be load bearing: bootstrap/payment-events-consumer.module.spec.ts
      # builds the real DI graph, which constructs a gRPC client that read
      # dist/protos/file_service.proto - a path that only exists once `nest build`
      # has copied it, so on a clean checkout the suite failed with "The invalid
      # .proto definition ... not found". files.module.ts now resolves that proto
      # relative to __dirname, which lands on src/protos under ts-jest and
      # dist/protos after a build, so the suite no longer depends on this order.
      # Keeping it anyway: a build failure is cheaper to read than 250 suites of
      # fallout, and it still matches how the service actually starts.
      - name: Build
        run: npm run build

      # maxWorkers is pinned to 50% in package.json on purpose: the default
      # oversubscribed and produced "a worker process has failed to exit
      # gracefully" on every full run. Do not override it here.
      - name: Test
        run: npx jest

