name: Verify

# Runs on every PR into the branch that DEPLOYS. Until this existed there was no
# automated check anywhere between a merge and production: deploy.yml fires on
# `main`, but Dokploy deploys from `dev`, so nothing ran tsc, jest or a build for
# the code that actually shipped. On 2026-09-03 three separate fixes reached
# production with a defect a check like this would have caught, each found only
# because somebody went looking afterwards.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      # Throwaway values, needed only so things RESOLVE. Nothing in this job
      # connects to a database, a cache or an identity provider.
      #
      # DATABASE_URL: prisma.config.ts calls env('DATABASE_URL') at load time and
      # THROWS when it resolves from neither the environment nor a .env file.
      # JWT_SECRET: three bootstrap consumer-module specs build the real DI
      # graph, which constructs JwtStrategy, which fails with "requires a secret
      # or key" without it.
      #
      # RABBITMQ_URL / REDIS_PASSWORD: config/env.validation.ts runs as
      # ConfigModule.forRoot's `validate` hook and THROWS on either one being
      # absent or empty. The same three bootstrap consumer-module specs that
      # need JWT_SECRET build the real DI graph, so they hit that hook and
      # failed with "Invalid environment configuration - refusing to start"
      # (8 suites / 22 tests). That validation is deliberate - it exists so a
      # misconfigured deploy crash-loops instead of silently connecting to
      # guest:guest or an unauthenticated Redis - so the fix belongs here, in
      # the job env, not in a weaker rule.
      #
      # These two must stay OBVIOUSLY fake. The real Redis password is a
      # load-bearing typo that nothing may "correct", and a plausible-looking
      # value here would be an invitation to copy it somewhere that connects.
      #
      # This is what the first version of this workflow got wrong. It was
      # "verified" locally with `env -u DATABASE_URL`, which unsets the shell
      # variable but leaves services/api/.env in place - so Prisma and Nest both
      # still found everything and the run passed. A local run only matches CI if
      # the .env file is moved aside too, which is how these two were found.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-verify-only-not-a-real-secret
      RABBITMQ_URL: amqp://ci-verify-only:ci-verify-only@127.0.0.1:5672/
      REDIS_PASSWORD: ci-verify-only-not-a-real-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches services/api/Dockerfile, so CI cannot pass on a Node version
          # production does not run.
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - run: npm ci

      # No postinstall hook in this package, and 153 source files import types
      # from @prisma/client, so the client must be generated before tsc.
      # `prisma.schema` in package.json points at the multi-file prisma/schema
      # directory.
      # It generates types only - it never connects. See the job-level env for
      # why DATABASE_URL has to be present anyway.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Build before test because that is the order production starts in. This
      # used to be load bearing: bootstrap/payment-events-consumer.module.spec.ts
      # builds the real DI graph, which constructs a gRPC client that read
      # dist/protos/file_service.proto - a path that only exists once `nest build`
      # has copied it, so on a clean checkout the suite failed with "The invalid
      # .proto definition ... not found". files.module.ts now resolves that proto
      # relative to __dirname, which lands on src/protos under ts-jest and
      # dist/protos after a build, so the suite no longer depends on this order.
      # Keeping it anyway: a build failure is cheaper to read than 250 suites of
      # fallout, and it still matches how the service actually starts.
      - name: Build
        run: npm run build

      # maxWorkers is pinned to 50% in package.json on purpose: the default
      # oversubscribed and produced "a worker process has failed to exit
      # gracefully" on every full run. Do not override it here.
      - name: Test
        run: npx jest


  file:
    name: File service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/file
    env:
      # prisma-client-py resolves datasource url at generate time and throws if
      # DATABASE_URL is absent. Nothing here connects. Same reasoning as the api
      # job above.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches services/file/Dockerfile (python:3.11-slim), so CI cannot
          # pass on an interpreter production does not run. Note the local venv
          # at ybb-new/.venv is 3.9 - do not take a green local run as proof.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/file/requirements.txt

      # WeasyPrint loads libgobject/pango through cffi at import time, so the
      # LoA PDF tests cannot even collect without these. This is the exact set
      # from services/file/Dockerfile minus the Pillow BUILD deps, which are not
      # needed because 3.11 wheels are prebuilt.
      #
      # These are why the file service was worth gating: on macOS all five LoA
      # PDF smoke tests fail with "cannot load library 'libgobject-2.0-0'", so
      # the local baseline reads 95 passed / 5 failed and every one of those
      # five got written off as environmental. Four of them are. The fifth was a
      # real assertion bug that only a Linux run could show.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 \
            fonts-noto-core fonts-noto-cjk

      # pytest is deliberately not in requirements.txt (it is a runtime image
      # manifest, and the Dockerfile installs it into the production image).
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Generates types only, never connects. app/infrastructure/persistence/
      # postgres/database.py does `from prisma import Prisma`, which raises
      # until the client is generated.
      - name: Generate Prisma client
        run: prisma generate

      - name: Test
        run: python -m pytest
