name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-api:
    name: Test API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json
      
      - name: Install dependencies
        working-directory: services/api
        run: npm ci
      
      - name: Run linter
        working-directory: services/api
        run: npm run lint
      
      - name: Run tests
        working-directory: services/api
        run: npm run test
      
      - name: Build
        working-directory: services/api
        run: npm run build

  test-payment:
    name: Test Payment Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Install dependencies
        working-directory: services/payment-service
        run: go mod download
      
      - name: Run tests
        working-directory: services/payment-service
        run: go test -v ./...
      
      - name: Build
        working-directory: services/payment-service
        run: go build -o bin/server ./cmd/server

  test-file:
    name: Test File Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: services/file-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run linter
        working-directory: services/file-service
        run: |
          pip install flake8
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run tests
        working-directory: services/file-service
        run: pytest

  test-dashboard:
    name: Test Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/admin-dashboard/package-lock.json
      
      - name: Install dependencies
        working-directory: services/admin-dashboard
        run: npm ci
      
      - name: Run linter
        working-directory: services/admin-dashboard
        run: npm run lint
      
      - name: Build
        working-directory: services/admin-dashboard
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-payment, test-file, test-dashboard]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build API Gateway
        uses: docker/build-push-action@v4
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false
          tags: ybb-platform/api:latest
      
      - name: Build Payment Service
        uses: docker/build-push-action@v4
        with:
          context: ./services/payment-service
          file: ./services/payment-service/Dockerfile
          push: false
          tags: ybb-platform/payment-service:latest
      
      - name: Build File Service
        uses: docker/build-push-action@v4
        with:
          context: ./services/file-service
          file: ./services/file-service/Dockerfile
          push: false
          tags: ybb-platform/file-service:latest
      
      - name: Build Admin Dashboard
        uses: docker/build-push-action@v4
        with:
          context: ./services/admin-dashboard
          file: ./services/admin-dashboard/Dockerfile
          push: false
          tags: ybb-platform/admin-dashboard:latest
